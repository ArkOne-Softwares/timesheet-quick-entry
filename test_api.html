<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkone Projects API Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 800px; 
            margin: 20px auto; 
            padding: 20px; 
        }
        .test-result { 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 4px; 
            font-family: monospace;
        }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; }
        button { 
            padding: 10px 20px; 
            margin: 5px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🚀 Arkone Projects API Test</h1>
    <p>Test your API endpoints to ensure they're working correctly.</p>
    
    <div>
        <button onclick="testConnection()">Test API Connection</button>
        <button onclick="testProjects()">Test Get Projects</button>
        <button onclick="testTasks()">Test Get Tasks</button>
        <button onclick="testUserPermissions()">Test User Permissions</button>
    </div>
    
    <div id="results"></div>

    <script>
        const API_BASE = '/api/method/arkone_projects.arkone_projects.api';
        
        function addResult(title, result, isSuccess = true) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${isSuccess ? 'success' : 'error'}`;
            resultDiv.innerHTML = `
                <h3>${title}</h3>
                <pre>${JSON.stringify(result, null, 2)}</pre>
            `;
            resultsDiv.appendChild(resultDiv);
        }
        
        async function makeApiCall(endpoint, params = {}) {
            try {
                const url = new URL(`${API_BASE}.${endpoint}`, window.location.origin);
                Object.keys(params).forEach(key => {
                    if (params[key] !== null && params[key] !== undefined) {
                        url.searchParams.append(key, params[key]);
                    }
                });
                
                console.log('Making API call to:', url.toString());
                
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                return result;
            } catch (error) {
                throw error;
            }
        }
        
        async function testConnection() {
            try {
                const result = await makeApiCall('test_api_connection');
                addResult('✅ API Connection Test', result, true);
            } catch (error) {
                addResult('❌ API Connection Test', { error: error.message }, false);
            }
        }
        
        async function testProjects() {
            try {
                const result = await makeApiCall('get_projects');
                addResult('✅ Get Projects Test', result, true);
            } catch (error) {
                addResult('❌ Get Projects Test', { error: error.message }, false);
            }
        }
        
        async function testTasks() {
            try {
                const result = await makeApiCall('get_tasks');
                addResult('✅ Get Tasks Test', result, true);
            } catch (error) {
                addResult('❌ Get Tasks Test', { error: error.message }, false);
            }
        }
        
        async function testUserPermissions() {
            try {
                const result = await makeApiCall('get_user_permissions');
                addResult('✅ User Permissions Test', result, true);
            } catch (error) {
                addResult('❌ User Permissions Test', { error: error.message }, false);
            }
        }
        
        // Auto-run connection test on page load
        window.onload = function() {
            console.log('Page loaded, testing API connection...');
            testConnection();
        };
    </script>
</body>
</html>
